name: Build plugin

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # On a tag like v1.2.3 the DLL gets version 1.2.3; otherwise the csproj version is used.
      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin
        run: dotnet build Emby.Bingers.csproj -c Release ${{ steps.version.outputs.args }}

      - name: End-to-end test
        working-directory: tests
        run: |
          python3 fake_bingers.py 8765 &
          sleep 1
          dotnet run -c Release

      - uses: actions/upload-artifact@v5
        with:
          name: Emby.Bingers
          path: bin/Release/netstandard2.0/Emby.Bingers.dll
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Emby.Bingers

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made in the GitHub UI creates the tag first, so it may already exist.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Emby.Bingers.dll --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" Emby.Bingers.dll \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
